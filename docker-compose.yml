version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    container_name: fleetmind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fleetmind
      POSTGRES_USER: fleetmind
      POSTGRES_PASSWORD: fleetmind123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
