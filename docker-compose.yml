version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    container_name: fleetmind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fleetmind}
      POSTGRES_USER: ${POSTGRES_USER:-fleetmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fleetmind123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fleetmind} -d ${POSTGRES_DB:-fleetmind}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
